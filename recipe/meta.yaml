{% set version = "5.0.5" %}

package:
  name: hsluv
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/h/hsluv/hsluv-{{ version }}.tar.gz
  sha256: fe9891df52ff78ddc9fc9cdba0fd0de49a4378d41e30a3901a1d716ec0c14163

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=38.6.0
  run:
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - hsluv

about:
  home: https://github.com/hsluv/hsluv-python
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: A Python implementation of HSLuv (revision 4).

extra:
  recipe-maintainers:
    - hmaarrfk
