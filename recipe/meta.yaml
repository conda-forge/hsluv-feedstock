{% set version = "5.0.4" %}

package:
  name: hsluv
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/h/hsluv/hsluv-{{ version }}.tar.gz
  sha256: 2281f946427a882010042844a38c7bbe9e0d0aaf9d46babe46366ed6f169b72e

build:
  noarch: python
  number: 2
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=38.6.0
  run:
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - hsluv

about:
  home: https://github.com/hsluv/hsluv-python
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: A Python implementation of HSLuv (revision 4).

extra:
  recipe-maintainers:
    - hmaarrfk
